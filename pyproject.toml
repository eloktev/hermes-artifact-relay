[build-system]
requires = []
build-backend = "no_build_backend"
backend-path = ["."]

[project]
name = "hermes-artifact-relay"
version = "1.0.0"
description = "Git-only Artifact Relay plugin for Hermes Agent"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Egor Loktev"}]
dependencies = []

[dependency-groups]
dev = ["pytest>=8,<10", "pyyaml>=6,<7", "ruff>=0.9,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
