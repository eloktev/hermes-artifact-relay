name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.7.0"
          enable-cache: true

      - name: Sync locked development environment
        run: uv sync --frozen

      - name: Verify lock file
        run: uv lock --check

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q

      - name: Reject unsupported Python package builds
        run: uv run python scripts/assert_no_build.py

      # Checkout happens after repository-local quality gates so tools do not lint or scan the
      # Hermes source tree as if it were plugin code.
      - name: Check out the tested Hermes runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: NousResearch/hermes-agent
          ref: 1b1975781f372e4d7fe4f448eab86cea5441f2e7
          path: .hermes-ci

      - name: Real Hermes doctor and Git-install smoke
        run: uv run python scripts/ci_smoke.py .hermes-ci
